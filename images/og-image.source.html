<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#12283f;
    font-family:"Bodoni 72","Didot",Georgia,serif;
    position:relative;
  }
  /* subtle 3x3 sudoku grid watermark */
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(249,240,224,.055) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(249,240,224,.055) 2px, transparent 2px),
      linear-gradient(to right, rgba(249,240,224,.022) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(249,240,224,.022) 1px, transparent 1px);
    background-size: 210px 210px, 210px 210px, 70px 70px, 70px 70px;
    background-position:-15px -15px, -15px -15px, -15px -15px, -15px -15px;
  }
  .vignette {
    position:absolute; inset:0;
    background:
      radial-gradient(120% 130% at 22% 40%, rgba(38,70,104,.55) 0%, rgba(18,40,63,0) 62%),
      radial-gradient(100% 100% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.42) 100%);
  }
  .wrap {
    position:relative; height:100%;
    display:flex; align-items:center; gap:64px;
    padding:0 76px;
  }
  .icon {
    flex:0 0 auto;
    width:400px; height:400px;
    border-radius:88px;
    overflow:hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(249,240,224,.10);
  }
  .icon img { width:100%; height:100%; display:block; }

  .copy { flex:1 1 auto; padding-top:6px; }
  h1 {
    font-weight:700;
    font-size:112px;
    line-height:.96;
    letter-spacing:-1px;
    color:#f9f0e0;
    text-shadow:0 3px 18px rgba(0,0,0,.35);
  }
  .kicker {
    margin-top:20px;
    font-family:"Copperplate","Optima",Georgia,serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:9px;
    color:#c9a55c;
    text-transform:uppercase;
  }
  .rule {
    margin:26px 0 26px;
    width:430px; height:2px;
    background:linear-gradient(to right,#bb974f 0%, rgba(187,151,79,.15) 100%);
  }
  .tagline {
    font-size:37px;
    line-height:1.25;
    color:#f4ead8;
  }
  .fine {
    margin-top:16px;
    font-family:"Bodoni 72","Didot",Georgia,serif;
    font-size:25px;
    line-height:1.45;
    color:rgba(244,234,216,.72);
  }
</style></head>
<body>
  <div class="grid"></div>
  <div class="vignette"></div>
  <div class="wrap">
    <div class="icon"><img src="data:image/png;base64,__ICON__"></div>
    <div class="copy">
      <h1>Simple Sudoku</h1>
      <div class="kicker">Nine by Nine</div>
      <div class="rule"></div>
      <div class="tagline">A clean, classic number puzzle</div>
      <div class="fine">Play free in your browser &mdash; no install,<br>no account, no ads</div>
    </div>
  </div>
</body></html>
